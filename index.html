<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">

<title>Trade Journal</title>
<script>(()=>{const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');g.fillStyle='#0b0d12';g.fillRect(0,0,180,180);g.fillStyle='#4f8cff';g.beginPath();g.roundRect(28,28,124,124,24);g.fill();g.fillStyle='#fff';[[58,64,16,50],[82,46,16,68],[106,58,16,56]].forEach(([x,y,w,h])=>{g.beginPath();g.roundRect(x,y,w,h,4);g.fill()});const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)})()</script>
<style>
:root{--bg:#0b0d12;--card:#151922;--card2:#1c2230;--line:#262d3d;--tx:#e8ecf4;--mu:#8b95aa;--ac:#4f8cff;--g:#2ecc71;--r:#ff5468;--y:#f5c542;--o:#ff9a3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 90px)}
h1{font-size:26px;margin:8px 2px 14px}h2{font-size:15px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:20px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.trade{display:flex;gap:12px;align-items:center}.trade img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--card2)}
.trade .m{flex:1;min-width:0}.trade .t{font-weight:600}.trade .s{color:var(--mu);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700}
.p-profit{background:#12351f;color:var(--g)}.p-loss{background:#3b141b;color:var(--r)}.p-none{background:var(--card2);color:var(--mu)}
nav{position:fixed;left:0;right:0;bottom:0;background:#0e1118ee;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom) + 6px)}
nav button{background:none;border:0;color:var(--mu);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;padding:4px}
nav button.on{color:var(--ac)}nav svg{width:24px;height:24px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 78px);width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:32px;box-shadow:0 6px 20px #0008}
label.f{display:block;color:var(--mu);font-size:12px;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:10px 14px;font:inherit;font-size:15px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.chip.on.c-G{background:var(--g)}.chip.on.c-Y{background:var(--y);color:#222}.chip.on.c-O{background:var(--o);color:#222}.chip.on.c-R{background:var(--r)}
.chip.on.pl{background:var(--g)}.chip.on.ls{background:var(--r)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}.btn.del{background:#3b141b;color:var(--r)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.shot{width:100%;border-radius:12px;margin-top:6px;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:26px}.stat span{color:var(--mu);font-size:12px}
.mu{color:var(--mu);font-size:13px}.empty{text-align:center;color:var(--mu);padding:50px 20px}
.note{white-space:pre-wrap;font-size:15px;line-height:1.4}
</style></head><body><div id="app"></div>
<nav id="nav"></nav><button class="fab" id="fab" aria-label="New trade">+</button>
<input type="file" id="file" accept="image/*" hidden><input type="file" id="imp" accept=".json,application/json" hidden>
<script src="ocr.js"></script>
<script>
// ---------- storage (IndexedDB, on this device) ----------
const DB='tradejournal',ST='kv';let db;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvget=k=>new Promise(r=>{const q=db.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)});
const kvset=(k,v)=>new Promise(r=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).put(v,k);t.oncomplete=r});

// Field layout copied from the sheet screenshot. Labels/options are editable in Settings.
const YN=['Yes','No'];
const DEFAULT_CFG={v:2,groups:[
 {id:'sleep',label:'Sleep state',q:'Did you get more than 5 hours of sleep?',opts:YN,multi:false},
 {id:'psych',label:'Psychological state',q:'Are there any psychological disturbances in your life today?',opts:YN,multi:false},
 {id:'balance',label:'Balance state',q:'Did you meditate today?',opts:YN,multi:false},
 {id:'focus',label:'Focus state',q:'Were you on any social media today?',opts:YN,multi:false},
 {id:'dd',label:'Drawdown state',q:'Drawdown state',opts:['Green','Yellow','Orange','Red'],multi:false,colored:true},
 {id:'catalyst',label:'Catalyst state',q:'Is there any news or catalyst within 30 minutes before or after the taken trade?',opts:YN,multi:false},
 {id:'pad',label:'Price action delivery factor',q:'Is it liquidity, catalyst news, or market that is driving the price action today?',opts:['Liquidity','Catalyst news','Market'],multi:true}],
 extra:[{id:'amd',label:'AMD PO3',opts:['A','M','D'],multi:false}],
 notes:[['initial','Initial notes'],['plan','Setup plan'],['post','Post notes'],['deviation','Setup deviation'],['mistakes','Mistakes'],['lessons','Lessons']]};
let trades=[],cfg=DEFAULT_CFG,view={name:'list'},nid=1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=async()=>{await kvset('trades',trades);await kvset('cfg',cfg)};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function blank(){return{id:Date.now().toString(36),date:today(),result:'',acc:'',num:'',grade:'',target:'',actual:'',pick:{},img:'',sym:'',pnl:'',qty:'',ctime:'',auto:{},notes:{}}}

// ---------- image: downscale before saving so storage stays small ----------
function shrink(file,max=1400){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};i.src=URL.createObjectURL(file)})}

// ---------- views ----------
const icons={list:'<path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',stats:'<path d="M5 20V10M12 20V4M19 20v-7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>',set:'<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>'};
function nav(){const n=[['list','Trades'],['stats','Stats'],['set','Settings']];document.getElementById('nav').innerHTML=n.map(([k,l])=>`<button class="${view.name===k?'on':''}" data-go="${k}"><svg viewBox="0 0 24 24">${icons[k]}</svg>${l}</button>`).join('');
 document.getElementById('nav').style.display=document.getElementById('fab').style.display=['edit','detail'].includes(view.name)?'none':''}
const pill=r=>r==='profit'?'<span class="pill p-profit">PROFIT</span>':r==='loss'?'<span class="pill p-loss">LOSS</span>':'<span class="pill p-none">OPEN</span>';
function render(){const a=document.getElementById('app');nav();({list:rList,stats:rStats,set:rSet,edit:rEdit,detail:rDetail})[view.name](a);if(view.name==='detail')drawSheet(document.getElementById('sheet'),view.t);window.scrollTo(0,0)}
function rList(a){const s=[...trades].sort((x,y)=>y.date.localeCompare(x.date)||y.id.localeCompare(x.id));
 a.innerHTML='<h1>Trades</h1>'+(s.length?s.map(t=>`<div class="card trade" data-open="${t.id}">${t.img?`<img src="${t.img}">`:'<img alt="">'}<div class="m"><div class="t">${t.num?'#'+esc(t.num)+' · ':''}${esc(t.date)}</div><div class="s">${esc([t.sym,t.pnl,t.grade?'Grade '+t.grade:''].filter(Boolean).join(' · '))}${t.target?' · Target '+esc(t.target):''}${t.actual?' · Actual '+esc(t.actual):''}</div></div>${pill(t.result)}</div>`).join(''):'<div class="empty">No trades yet.<br>Tap + to log your first one.</div>')}
function rStats(a){const p=trades.filter(t=>t.result==='profit').length,l=trades.filter(t=>t.result==='loss').length,c=p+l;
 const wr=c?Math.round(p/c*100)+'%':'-';
 a.innerHTML=`<h1>Stats</h1><div class="stats"><div class="stat"><b>${trades.length}</b><span>Trades logged</span></div><div class="stat"><b>${wr}</b><span>Win rate (closed)</span></div><div class="stat"><b style="color:var(--g)">${p}</b><span>Profit</span></div><div class="stat"><b style="color:var(--r)">${l}</b><span>Loss</span></div></div>`+
 '<h2>Win rate by tag</h2>'+[...cfg.groups,...cfg.extra].map(g=>g.opts.map(o=>{const m=trades.filter(t=>(t.pick[g.id]||[]).includes(o)&&t.result);if(!m.length)return'';const w=m.filter(t=>t.result==='profit').length;return`<div class="card row" style="align-items:center;padding:10px 14px"><div>${esc(g.label)}: <b>${esc(o)}</b></div><div style="flex:0 0 auto" class="mu">${w}/${m.length} · ${Math.round(w/m.length*100)}%</div></div>`}).join('')).join('')||'<div class="mu">Tag trades to see breakdowns here.</div>'}
function rSet(a){a.innerHTML=`<h1>Settings</h1><div class="card"><b>Backup</b><p class="mu">Trades are stored on this phone. Export a backup file now and then (save it to Files or iCloud).</p><div class="row"><button class="btn" id="exp">Export</button><button class="btn sec" id="impb">Import</button></div></div>`}
function chips(g,t){return`<div class="chips">${g.opts.map(o=>`<button type="button" class="chip c-${g.colored?o[0]:''} ${(t.pick[g.id]||[]).includes(o)?'on':''}" data-g="${g.id}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}
const fl=(t,k)=>t.auto&&t.auto[k]?'<span style="color:var(--y);text-transform:none">· read from screenshot, confirm</span>':'';
function rEdit(a){const t=view.t;
 a.innerHTML=`<div class="top"><button class="btn sec" id="cancel">Cancel</button><b>${view.isNew?'New trade':'Edit trade'}</b><button class="btn" id="save">Save</button></div>
<h2>Check-in</h2><div class="card">${cfg.groups.map(g=>`<div style="margin-bottom:14px"><div style="font-size:15px;margin-bottom:6px">${esc(g.q)}</div>${chips(g,t)}</div>`).join('')}</div><h2>Trade</h2><label class="f">Chart screenshot</label>${t.img?`<img class="shot" src="${t.img}">`:''}<button class="btn sec" id="pick" style="margin-top:8px;width:100%">${t.img?'Replace screenshot':'Add screenshot from Photos'}</button>
<div class="row"><div><label class="f">Date</label><input type="date" id="date" value="${esc(t.date)}"></div><div><label class="f">Trade #</label><input type="text" id="num" value="${esc(t.num)}"></div></div>
<div id="scan" class="mu" style="margin-top:8px">${esc(view.scan||'')}</div>
<div class="row"><div><label class="f">Symbol ${fl(t,'sym')}</label><input type="text" id="sym" value="${esc(t.sym)}"></div><div><label class="f">Open P&L, unrealized (USD) ${fl(t,'pnl')}</label><input type="text" id="pnl" value="${esc(t.pnl)}"></div></div>
<div class="row"><div><label class="f">Qty ${fl(t,'qty')}</label><input type="text" id="qty" value="${esc(t.qty)}"></div><div><label class="f">Chart clock ${fl(t,'ctime')}</label><input type="text" id="ctime" value="${esc(t.ctime)}"></div></div>
<label class="f">Result ${fl(t,'result')}</label><div class="chips"><button type="button" class="chip pl ${t.result==='profit'?'on':''}" data-res="profit">Profit</button><button type="button" class="chip ls ${t.result==='loss'?'on':''}" data-res="loss">Loss</button></div>
<div class="row"><div><label class="f">ACC #</label><input type="text" id="acc" value="${esc(t.acc)}"></div><div><label class="f">Setup grade</label><input type="text" id="grade" value="${esc(t.grade)}"></div></div>
<div class="row"><div><label class="f">Target R:R</label><input type="text" id="target" value="${esc(t.target)}"></div><div><label class="f">Actual</label><input type="text" id="actual" value="${esc(t.actual)}"></div></div>
<label class="f">AMD PO3</label>${chips(cfg.extra[0],t)}
${cfg.notes.map(([k,l])=>`<label class="f">${l}</label><textarea data-n="${k}">${esc(t.notes[k]||'')}</textarea>`).join('')}
${view.isNew?'':'<button class="btn del" id="del" style="width:100%;margin-top:24px">Delete trade</button>'}`}
function rDetail(a){const t=view.t;
 a.innerHTML=`<div class="top"><button class="btn sec" id="back">Back</button><b>${t.num?'#'+esc(t.num):esc(t.date)}</b><button class="btn" id="edit">Edit</button></div><canvas id="sheet" style="width:100%;border-radius:10px;display:block"></canvas><div class="row" style="margin:10px 0"><button class="btn" id="shareimg">Save / share as image</button></div><h2>Details</h2>${t.img?`<img class="shot" src="${t.img}">`:''}
<div class="card" style="margin-top:12px">${pill(t.result)} <span class="mu">${esc(t.date)}${t.acc?' · ACC '+esc(t.acc):''}</span><div style="margin-top:8px">${t.sym?esc(t.sym)+' ':''}${t.pnl?'· open P&L <b>'+esc(t.pnl)+'</b> ':''}${t.qty?'· Qty '+esc(t.qty)+' ':''}${t.ctime?'· '+esc(t.ctime):''}</div><div style="margin-top:8px">${t.grade?'Grade <b>'+esc(t.grade)+'</b> ':''}${t.target?'· Target <b>'+esc(t.target)+'</b> ':''}${t.actual?'· Actual <b>'+esc(t.actual)+'</b>':''}</div></div>
${[...cfg.groups,...cfg.extra].filter(g=>(t.pick[g.id]||[]).length).map(g=>`<div class="card"><div class="mu">${esc(g.label)}${g.q&&g.q!==g.label?' - '+esc(g.q):''}</div>${t.pick[g.id].map(o=>`<span class="pill p-none" style="margin:4px 4px 0 0;font-size:14px">${esc(o)}</span>`).join('')}</div>`).join('')}
${cfg.notes.filter(([k])=>t.notes[k]).map(([k,l])=>`<div class="card"><div class="mu">${l}</div><div class="note">${esc(t.notes[k])}</div></div>`).join('')}`}


// Composed entry: chart on top, your answers and notes below (same layout idea as your sheet)
function wrap(g,text,x,y,mw,lh){const words=String(text||'').split(/\s+/);let line='',n=0;for(const w of words){const t=line?line+' '+w:w;if(g.measureText(t).width>mw&&line){g.fillText(line,x,y+n*lh);line=w;n++}else line=t}g.fillText(line,x,y+n*lh);return n+1}
function drawSheet(c,t,done){const W=1200,pad=24;const rows=[];
 rows.push(['RESULT',(t.result==='profit'?'PROFIT':t.result==='loss'?'LOSS':'OPEN')+(t.pnl?'   open P&L '+t.pnl+' USD (unrealized)':'')+(t.sym?'   '+t.sym:'')]);
 rows.push(['DATE / ACC # / TRADE #',[t.date,t.acc&&'ACC '+t.acc,t.num&&'#'+t.num,t.ctime].filter(Boolean).join('   ')]);
 rows.push(['GRADE / TARGET R:R / ACTUAL',[t.grade&&'Grade '+t.grade,t.target&&'Target '+t.target,t.actual&&'Actual '+t.actual].filter(Boolean).join('   ')||'-']);
 rows.push(['AMD PO3',(t.pick.amd||[]).join(', ')||'-']);
 for(const g of cfg.groups)rows.push([g.label.toUpperCase(),(t.pick[g.id]||[]).join(', ')||'-']);
 const notes=cfg.notes.filter(([k])=>t.notes[k]);
 const draw=(img)=>{const g0=document.createElement('canvas').getContext('2d');g0.font='22px sans-serif';
  let ih=0,iw=W;if(img){ih=Math.round(W*img.naturalHeight/img.naturalWidth)}
  const colL=400,rowH=44;let h=ih+rows.length*rowH+20;
  const noteBlocks=notes.map(([k,l])=>{g0.font='22px sans-serif';const lines=(()=>{const words=t.notes[k].split(/\s+/);let line='',n=1;for(const w of words){const tt=line?line+' '+w:w;if(g0.measureText(tt).width>W-2*pad&&line){line=w;n++}else line=tt}return n})();return[l,t.notes[k],lines]});
  h+=noteBlocks.reduce((a,b)=>a+40+b[2]*30+16,0)+20;
  c.width=W;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,h);if(img)g.drawImage(img,0,0,W,ih);
  let y=ih;g.strokeStyle='#000';g.lineWidth=2;
  for(const [a,b] of rows){g.strokeRect(1,y,W-2,rowH);g.beginPath();g.moveTo(colL,y);g.lineTo(colL,y+rowH);g.stroke();g.fillStyle='#000';g.font='bold 20px sans-serif';g.fillText(a.length>32?a.slice(0,32):a,pad/2+4,y+29);g.font='22px sans-serif';g.fillText(b,colL+14,y+29);y+=rowH}
  y+=20;for(const [l,txt,n] of noteBlocks){g.fillStyle='#000';g.font='bold 20px sans-serif';g.fillText(l.toUpperCase(),pad,y+24);g.font='22px sans-serif';wrap(g,txt,pad,y+56,W-2*pad,30);y+=40+n*30+16}
  done&&done(c)};
 if(t.img){const i=new Image();i.onload=()=>draw(i);i.src=t.img}else draw(null)}
async function shareSheet(t){const c=document.createElement('canvas');drawSheet(c,t,async cv=>{cv.toBlob(async b=>{const f=new File([b],'journal-'+(t.num||t.date)+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch{}}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()}})})}

// ---------- events ----------
function readForm(){const t=view.t;for(const k of['date','num','acc','grade','target','actual','sym','pnl','qty','ctime']){const e=document.getElementById(k);if(e)t[k]=e.value}document.querySelectorAll('[data-n]').forEach(e=>t.notes[e.dataset.n]=e.value)}
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-open]');if(!b)return;const d=b.dataset;
 if(d.go){view={name:d.go};render()}
 else if(b.id==='fab'){view={name:'edit',t:blank(),isNew:true};render()}
 else if(d.open){view={name:'detail',t:trades.find(x=>x.id===d.open)};render()}
 else if(b.id==='shareimg'){shareSheet(view.t)}
 else if(b.id==='back'){view={name:'list'};render()}
 else if(b.id==='edit'){view={name:'edit',t:structuredClone(view.t)};render()}
 else if(b.id==='cancel'){view={name:'list'};render()}
 else if(b.id==='save'){readForm();const i=trades.findIndex(x=>x.id===view.t.id);i<0?trades.push(view.t):trades[i]=view.t;await save();view={name:'list'};render()}
 else if(b.id==='del'){if(confirm('Delete this trade?')){trades=trades.filter(x=>x.id!==view.t.id);await save();view={name:'list'};render()}}
 else if(b.id==='pick'){readForm();document.getElementById('file').click()}
 else if(d.res){readForm();view.t.result=view.t.result===d.res?'':d.res;render()}
 else if(d.g){readForm();const t=view.t,g=[...cfg.groups,...cfg.extra].find(x=>x.id===d.g),cur=t.pick[d.g]||[];t.pick[d.g]=cur.includes(d.o)?cur.filter(x=>x!==d.o):(g.multi?[...cur,d.o]:[d.o]);const y=scrollY;render();scrollTo(0,y)}
 else if(b.id==='exp'){const blob=new Blob([JSON.stringify({trades,cfg},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trade-journal-'+today()+'.json';a.click()}
 else if(b.id==='impb'){document.getElementById('imp').click()}
 else if(b.id==='svset'){document.querySelectorAll('[data-gl]').forEach(i=>cfg.groups.find(g=>g.id===i.dataset.gl).label=i.value.trim()||'Untitled');document.querySelectorAll('[data-go2]').forEach(i=>cfg.groups.find(g=>g.id===i.dataset.go2).opts=i.value.split(',').map(s=>s.trim()).filter(Boolean));await save();alert('Saved')}
});
document.getElementById('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const big=URL.createObjectURL(f);view.t.img=await shrink(f,1400);view.scan='Reading screenshot...';render();const set=m=>{view.scan=m;const s=document.getElementById('scan');if(s)s.textContent=m};
 try{const r=await readShot(big,set),t=view.t,fd=r.found;readForm();t.auto={};
  if(fd.symbol){t.sym=fd.symbol;t.auto.sym=1}if(fd.pnl){t.pnl=fd.pnl;t.auto.pnl=1}if(fd.clock){t.ctime=fd.clock;t.auto.ctime=1}
  const n=Object.keys(fd).length;view.scan=n?'Filled what could be read. Yellow fields came from the screenshot: confirm them. The P&L is the unrealized open-position value at capture time, not a final result: pick Profit or Loss yourself. Everything else (date, grade, states, notes) is yours to enter.':'Could not read trade details from this screenshot. Fill in manually.'}
 catch(err){view.scan='Could not run the screenshot reader (needs internet the first time). Fill in manually.'}render()};
