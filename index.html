<script>
// ---------- storage (IndexedDB, on this device) ----------
const DB='tradejournal',ST='kv';let db;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvget=k=>new Promise(r=>{const q=db.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)});
const kvset=(k,v)=>new Promise(r=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).put(v,k);t.oncomplete=r});

// Field layout copied from the sheet screenshot. Labels and options are editable in Settings.
const YN=['Yes','No'];
const DEFAULT_CFG={v:3,groups:[
 {id:'sleep',label:'Sleep State',q:'Did you get more than 5 hours of sleep?',opts:YN,multi:false},
 {id:'psych',label:'Psychological State',q:'Are there any psychological disturbances in your life today?',opts:YN,multi:false},
 {id:'balance',label:'Balance State',q:'Did you meditate today?',opts:YN,multi:false},
 {id:'focus',label:'Focus State',q:'Were you on any social media today?',opts:YN,multi:false},
 {id:'dev',label:'Plan Deviation State',q:'Did you deviate from your initial trade plan?',opts:YN,multi:false},
 {id:'dd',label:'Drawdown State',q:'Drawdown State',opts:['Green','Yellow','Orange','Red'],multi:false,colored:true},
 {id:'catalyst',label:'Catalyst State',q:'Was there any news or catalyst within 30 minutes before or after the trade you took?',opts:YN,multi:false},
 {id:'pad',label:'Price Action Delivery State',q:'Which is driving the price action today: liquidity, catalyst news, or the market?',opts:['Liquidity','Catalyst news','Market'],multi:true}],
 accounts:[],
 extra:[{id:'amd',label:'AMD PO3',opts:['A','M','D'],multi:false}],
 notes:[['initial','Initial notes'],['plan','Setup plan'],['post','Post notes'],['deviation','Setup deviation'],['mistakes','Mistakes'],['lessons','Lessons']]};
let trades=[],cfg=DEFAULT_CFG,view={name:'list'},nid=1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=async()=>{await kvset('trades',trades);await kvset('cfg',cfg);window.JSYNC&&JSYNC.changed()};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function etTime(t){if(!t.ttime||!t.date)return '';const z=t.ttz||'America/New_York',m=/^(\d{1,2}):(\d\d)/.exec(t.ttime),d=/^(\d{4})-(\d\d)-(\d\d)/.exec(t.date);if(!m||!d)return '';
 const off=(zz,ms)=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:zz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000};
 const loc=Date.UTC(+d[1],+d[2]-1,+d[3],+m[1],+m[2]);let g=loc-off(z,loc);g=loc-off(z,g);
 return new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(g))}
function etWd(t){if(!t.ttime||!t.date)return null;const z=t.ttz||'America/New_York',m=/^(\d{1,2}):(\d\d)/.exec(t.ttime),d=/^(\d{4})-(\d\d)-(\d\d)/.exec(t.date);if(!m||!d)return null;
 const off=(zz,ms)=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:zz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000};
 const loc=Date.UTC(+d[1],+d[2]-1,+d[3],+m[1],+m[2]);let g=loc-off(z,loc);g=loc-off(z,g);
 const w=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short'}).format(new Date(g));return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(w)}
function blank(){return{id:Date.now().toString(36),date:today(),result:'',acc:'',num:'',grade:'',target:'',actual:'',pick:{},img:'',img2:'',sym:'',pnl:'',qty:'',ctime:'',cx:'',ttime:'',ttz:'America/New_York',sess:'',dir:'',entry:'',stop:'',tp:'',exits:[{p:'',s:''}],fees:'',ppp:'',auto:{},notes:{}}}

// ---------- image: stored as the untouched original (full resolution, no compression) ----------
function shrink(file){return new Promise(res=>{const rd=file=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r('');f.readAsDataURL(file)});
 if(/^image\/(png|jpeg|webp)$/.test(file.type)){rd(file).then(res);return}
 const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;c.getContext('2d').drawImage(i,0,0);res(c.toDataURL('image/png'))};i.onerror=()=>rd(file).then(res);i.src=URL.createObjectURL(file)})}


// ---------- $ per point by futures root ----------

const FIELDS=[['sym','Ticker / symbol'],['side','Side (buy/sell or long/short)'],['qty','Quantity'],['price','Fill price'],['time','Time'],['status','Status (optional)'],['entry','Entry price (paired files)'],['exit','Exit price (paired files)'],['ptime','Entry time (paired files)'],['pnl','Net P&L (optional)'],['fee','Commission / fees (optional)']];

function show(){let el=document.getElementById('csvmod');if(!el){el=document.createElement('div');el.id='csvmod';el.style.cssText='position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px 40px';document.body.appendChild(el)}
 const h=S.rows[S.hi]||[];const ok=mapOk(S.m);let body=`<div class="top"><b>Import CSV</b></div><div class="card"><p class="mu">File: ${esc(S.name)}${S.fmt?'<br>Detected: <b>'+esc(S.fmt)+'</b>':'<br>Format not recognised by name. Check the column match below.'}</p></div>`;
 body+=`<details class="card" ${(S.fmt&&ok)?'':'open'}><summary><b>Columns</b> <span class="mu">(tap to check or change)</span></summary><p class="mu">Header row: line ${S.hi+1}. Change a match if it is wrong.</p>${FIELDS.map(([k,l])=>`<label class="f">${l}</label><select data-cm="${k}"><option value="">- not in file -</option>${h.map((x,i)=>`<option value="${i}" ${S.m[k]===i?'selected':''}>${esc(x||('column '+(i+1)))}</option>`).join('')}</select>`).join('')}</details>`;
 if(!ok){body+=`<div class="card"><p class="mu">Not enough columns matched yet. Needed: ticker, side, and either (quantity, price, time) or (entry price and exit price).</p></div>`}
 else{const r=build(S.rows,S.hi,S.m);S.res=r;const anyT=r.out.some(x=>x.tp&&!x.tp.dateOnly);const amb=r.out.some(x=>x.tp&&x.tp.amb);
  const ex=new Set(trades.map(t=>[t.sym,t.date,t.ttime,t.dir,t.entry].join('|')));S.sel=S.sel&&S.selFor===S.rows?S.sel:null;
  r.out.forEach(x=>{const t=toTrade(x,S.tz||'America/New_York','x');x._d=ex.has([t.sym,t.date,t.ttime,t.dir,t.entry].join('|'))});
  body+=`<h2>Times in this file</h2><div class="card"><p class="mu">${anyT?'Starts on the time zone of this phone. Check it matches the file. Times are converted to Eastern Time, like the rest of your journal.'+(/^TradingView/.test(S.fmt||'')?' TradingView writes times in the time zone of the device that exported the file, not the chart time zone.':'')+'':'The file has no clock times.'}</p>${anyT?`<select id="csvtz">${(S.dz&&!TZS.some(z=>z[0]===S.dz)?[[S.dz,S.dz.replace(/_/g,' ')+' (this device)'],...TZS]:TZS).map(([v,l])=>`<option value="${v}" ${S.tz===v?'selected':''}>${v===S.dz&&!/device/.test(l)?l+' (this device)':l}</option>`).join('')}</select>`:''}${amb?'<p class="mu">Dates look like day/month or month/day. They are read as month/day/year.</p>':''}</div>`;
  const rd=r.out.map((x,i)=>{const t=toTrade(x,S.tz||'America/New_York','x');return`<label class="f" style="display:flex;gap:8px;align-items:flex-start;text-transform:none;margin:8px 0"><input type="checkbox" data-ci="${i}" style="width:auto;margin-top:3px" ${x._d?'':'checked'}><span>${esc(t.date)} ${esc(t.ttime||'')} &nbsp;${esc(t.sym)} ${esc(t.dir)} ${esc(t.qty||'-')} @ ${esc(t.entry)}<br><span class="mu">exit ${esc(t.exits.map(z=>z.p).join(', '))} &nbsp;P&amp;L ${t.pnl===''?'-':esc(t.pnl)}${x._d?' &nbsp;(already in journal)':''}</span></span></label>`}).join('');
  body+=`<h2>${r.out.length} trade${r.out.length===1?'':'s'} found</h2><div class="card">${r.out.length?'':'<p class="mu">Nothing importable with these columns.</p>'}<div>${rd}</div>${Object.keys(r.skipped).length?'<p class="mu">Skipped: '+Object.keys(r.skipped).map(k=>r.skipped[k]+' x '+esc(k)).join('; ')+'.</p>':''}<p class="mu">Stop, target, risk and $ per point are not in broker files, so they stay empty for you to fill. P&amp;L shows "-" when the file does not state it.</p></div>`}
 body+=`<div class="row"><button class="btn sec" id="csvx">Cancel</button><button class="btn" id="csvgo" ${ok&&S.res&&S.res.out.length?'':'disabled'}>Add selected</button></div>`;el.innerHTML=body;
 el.querySelectorAll('[data-cm]').forEach(s=>s.onchange=()=>{S.m[s.dataset.cm]=s.value===''?null:+s.value;S.fmt=S.fmt;show()});const tz=el.querySelector('#csvtz');if(tz)tz.onchange=()=>{S.tz=tz.value;const y=el.scrollTop;show();el.scrollTop=y};
 el.querySelector('#csvx').onclick=()=>{el.remove();S=null};
 el.querySelector('#csvgo').onclick=async()=>{const need=S.res.out.some(x=>x.tp&&!x.tp.dateOnly);if(need&&!S.tz){alert('Choose the timezone of the file first.');return}const add=[];el.querySelectorAll('[data-ci]').forEach(c=>{if(c.checked)add.push(toTrade(S.res.out[+c.dataset.ci],S.tz||'America/New_York',S.fmt||'CSV'))});if(!add.length){alert('Nothing selected.');return}trades=[...trades,...add];await save();el.remove();S=null;view={name:'list'};render();alert(add.length+' trade'+(add.length===1?'':'s')+' added. Open each to add stop, target and notes.')}}
return{open}})();
const CSVX=(()=>{
const q=v=>{let s=v==null?'':String(v);if(/^[=+\-@\t\r]/.test(s)&&!/^[-+]?\d*\.?\d+$/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function run(){const gs=[...(cfg.groups||[]),...(cfg.extra||[])];const H=['Date','Time (ET)','Ticker','Direction','Result','Net P&L','Contracts','Entry','Stop','Target','Exit prices','Exit sizes','Fees','$ per point','Session','Grade','Account','Trade #','R'].concat(gs.map(g=>g.label||g.q||g.id)).concat(['Imported from']);const rows=[...trades].sort((a,b)=>(a.date+(a.ttime||'')).localeCompare(b.date+(b.ttime||''))).map(t=>{let r=null;try{r=rOf(t)}catch(e){}if(r!=null&&!isFinite(r))r=null;const ex=(t.exits||[]).filter(x=>x.p!==''&&x.p!=null);return[t.date,t.ttime,t.sym,t.dir,t.result==='profit'?'Profit':t.result==='loss'?'Loss':t.result==='be'?'Breakeven':'',t.pnl,t.qty,t.entry,t.stop,t.tp,ex.map(x=>x.p).join(' | '),ex.map(x=>x.s).join(' | '),t.fees,t.ppp,(()=>{try{return sessOf(t)}catch(e){return t.sess}})(),t.grade,acctText(t),t.num,r==null?'':Math.round(r*100)/100].concat(gs.map(g=>((t.pick||{})[g.id]||[]).join(', '))).concat([t.imp?t.imp.src:''])});
 const csv='\uFEFF'+[H,...rows].map(r=>r.map(q).join(',')).join('\r\n')+'\r\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mirr-r-journal-statement-'+today()+'.csv';a.click()}
return{run}})();
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-csvx]');if(b)CSVX.run();const c=e.target.closest&&e.target.closest('#csvimp');if(c){let f=document.getElementById('csvfile');if(!f){f=document.createElement('input');f.type='file';f.id='csvfile';f.accept='.csv,.txt,text/csv,text/plain';f.style.display='none';f.onchange=async()=>{const x=f.files[0];if(x){try{CSVI.open(await x.text(),x.name)}catch(err){alert('Could not read that file.')}}f.value=''};document.body.appendChild(f)}f.click()}});

/* Download everything / reset account */
(()=>{
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function collect(onP){const got=[];const oc=URL.createObjectURL,ok=HTMLAnchorElement.prototype.click,m=new Map();
 URL.createObjectURL=b=>{const u=oc.call(URL,b);m.set(u,b);return u};
 HTMLAnchorElement.prototype.click=function(){if(this.download&&m.has(this.href)){got.push([this.download,m.get(this.href)]);return}return ok.call(this)};
 const steps=[['Journal backup (JSON)','#exp'],['Trades: Excel','[data-exp="xlsx"]'],['Trades: Word','[data-exp="docx"]'],['Trades: PDF (Data)','[data-exp="pdf"]'],['Trades: TXT','[data-exp="txt"]'],['Trades: RTF','[data-exp="rtf"]'],['Trades: PDF (Screenshots)','[data-exp="stack"]'],['Trades: CSV','[data-csvx]'],['Stats: Excel','[data-sexp="xlsx"]'],['Stats: Word','[data-sexp="docx"]'],['Stats: PDF','[data-sexp="pdf"]'],['Stats: TXT','[data-sexp="txt"]'],['Stats: RTF','[data-sexp="rtf"]']];
 const fails=[];
 try{for(const [lab,sel] of steps){const b=document.querySelector(sel);onP(lab);if(!b){fails.push(lab);continue}const n=got.length;b.click();const t0=Date.now();while(got.length===n&&Date.now()-t0<180000)await wait(60);if(got.length===n)fails.push(lab);await wait(80)}}
 finally{URL.createObjectURL=oc;HTMLAnchorElement.prototype.click=ok}
 return{got,fails}}
async function dlAll(btn,note){if(btn.disabled)return;btn.disabled=true;const prev=btn.textContent;try{const {got,fails}=await collect(l=>{btn.textContent='Preparing... '+l});if(!got.length)throw new Error('nothing could be prepared');const files=[];for(const [n,b] of got)files.push([n,new Uint8Array(await b.arrayBuffer())]);let k=0;for(const t of trades)[['entry',t.img],['exit',t.img2]].forEach(([w,u])=>{const m=u&&/^data:image\/(\w+);base64,(.*)$/s.exec(u);if(m){const bin=atob(m[2]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);k++;files.push(['screenshots/'+[t.date,(t.sym||'trade').replace(/[^A-Za-z0-9!_-]/g,''),(t.id||'').slice(-5),w].join('_')+'.'+(m[1]==='jpeg'?'jpg':m[1]),a])}});const z=window.__exp.zip(files);const blob=z instanceof Blob?z:new Blob([z],{type:'application/zip'});window.__exp.saveBlob(blob,'mirr-r-all-files-'+today()+'.zip');if(note)note.textContent='Saved one zip with '+got.length+' files'+(k?' and '+k+' original screenshot'+(k===1?'':'s'):'')+(fails.length?'. Not included: '+fails.join(', '):'')+'. Isolated single-section stats files are not included (they are parts of the Stats files).'}catch(e){if(note)note.textContent='Download failed: '+e.message+'. Use the individual downloads below.'}btn.disabled=false;btn.textContent=prev}
function resetFlow(){if(document.getElementById('rstmod'))return;const n=trades.length,shots=trades.reduce((a,t)=>a+(t.img?1:0)+(t.img2?1:0),0);
 if(!confirm('Step 1 of 2.\n\nReset Account permanently deletes all '+n+' trade'+(n===1?'':'s')+' and '+shots+' screenshot'+(shots===1?'':'s')+' from this journal, on this phone'+(window.JSYNC?' and from your private synced account if you are signed in':'')+'.\n\nIt cannot be undone. Your settings (tags, sessions, R basis) are kept.\n\nContinue to the final step?'))return;
 const el=document.createElement('div');el.id='rstmod';el.style.cssText='position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px 40px';
 el.innerHTML='<div class="top"><b>Reset Account - step 2 of 2</b></div><div class="card"><p class="mu">This deletes '+n+' trade'+(n===1?'':'s')+' and '+shots+' screenshot'+(shots===1?'':'s')+'. There is no undo.</p><p class="mu">Download your files first. The button below saves everything in one zip.</p><button class="btn sec" id="rdl" style="width:100%">Download all files and assets</button><div class="mu" id="rnote" style="margin-top:8px"></div><label class="f" style="display:flex;gap:8px;align-items:center;text-transform:none"><input type="checkbox" id="rck" style="width:auto">I have saved my files and understand this cannot be undone</label><label class="f">Type RESET to confirm</label><input type="text" id="rtx" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><div class="row"><button class="btn sec" id="rno">Cancel</button><button class="btn" id="rgo" disabled>Delete everything</button></div>';
 document.body.appendChild(el);const go=el.querySelector('#rgo'),ck=el.querySelector('#rck'),tx=el.querySelector('#rtx');const chk=()=>{go.disabled=!(ck.checked&&tx.value.trim()==='RESET')};ck.onchange=chk;tx.oninput=chk;
 el.querySelector('#rno').onclick=()=>el.remove();el.querySelector('#rdl').onclick=e=>dlAll(e.target,el.querySelector('#rnote'));
 go.onclick=async()=>{if(go.disabled)return;go.disabled=true;trades=[];await save();el.remove();view={name:'list'};render();alert('Account reset. All trades and screenshots were deleted.')}}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('#dlall');if(a){dlAll(a,document.getElementById('dlnote'));return}if(e.target.closest&&e.target.closest('#rstacc'))resetFlow()});
})();
</script>
<script>/* pull down to refresh (trades list) */
(function(){let y0=null,d=0,el=null;const ok=()=>window.scrollY<=0&&typeof view!=='undefined'&&['list','stats','set'].includes(view.name)&&window.JSYNC&&!document.getElementById('rstmod');
function bar(){if(!el){el=document.createElement('div');el.style.cssText='position:fixed;left:0;right:0;top:0;z-index:50;text-align:center;font-size:11px;letter-spacing:.04em;color:var(--mu,#888);padding:calc(env(safe-area-inset-top,0px) + 8px) 0 8px;background:var(--bg,#111);transform:translateY(-100%);transition:transform .15s;pointer-events:none';document.body.appendChild(el)}return el}
document.addEventListener('touchstart',e=>{y0=ok()&&e.touches.length===1?e.touches[0].clientY:null;d=0},{passive:true});
document.addEventListener('touchmove',e=>{if(y0==null)return;d=e.touches[0].clientY-y0;if(d>0&&window.scrollY<=0){const b=bar();b.textContent=d>70?'Release to refresh':'Pull to refresh';b.style.transform='translateY('+Math.min(0,-100+d*1.2)+'%)'}},{passive:true});
const endH=async()=>{if(y0==null)return;const go=d>70;y0=null;const b=el;if(!go){if(b)b.style.transform='translateY(-100%)';return}
b.textContent='Refreshing...';b.style.transform='translateY(0)';let r=false;try{r=await JSYNC.refresh()}catch(e){}
b.textContent=r?'Up to date':'Sign in under Settings to sync';setTimeout(()=>{b.style.transform='translateY(-100%)'},500)};document.addEventListener('touchend',endH);document.addEventListener('touchcancel',endH);
})();</script>
<script>/* tap safety net for the screenshot cards + inline error report + tap probe */
(function(){const SEL='#usetr,#canddis,#candfin,#candqty,#candtk,#candtime';
const r0=window.render;if(typeof r0==='function')window.render=function(){window.__rc=(window.__rc||0)+1;return r0.apply(this,arguments)};
let tm=null,el=null;const say=m=>{return;if(!el){el=document.createElement('div');el.style.cssText='position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:80;padding:6px 8px;font-size:11px;background:#000c;color:#fff;border:1px solid #888;pointer-events:none;word-break:break-all';document.body.appendChild(el)}el.textContent=m;el.style.display='block';clearTimeout(tm);tm=setTimeout(()=>{el.style.display='none'},5000)};
const key=b=>b.id+'|'+(b.dataset.sh||'')+'|'+(b.dataset.k||'')+'|'+(b.dataset.alt||'');
const find=k=>[...document.querySelectorAll(SEL)].find(x=>key(x)===k);
document.addEventListener('touchstart',e=>{const b=e.target.closest&&e.target.closest(SEL);if(!b||e.touches.length!==1)return;const k=key(b),x0=e.touches[0].clientX,y0=e.touches[0].clientY,t0=Date.now(),rc0=window.__rc||0;let mv=0;const T=e.target;
const done=(type,ev)=>{T.removeEventListener('touchmove',mm);T.removeEventListener('touchend',en);T.removeEventListener('touchcancel',ca);return type};
const mm=()=>{mv++};
const en=ev=>{done();const c=ev.changedTouches[0],d=Math.hypot(c.clientX-x0,c.clientY-y0),tgt=find(k),still=b.isConnected;say('touchend | moved '+Math.round(d)+'px | '+(Date.now()-t0)+'ms | node still in page:'+(still?1:0)+' | renders since touch:'+((window.__rc||0)-rc0));
 if(d<10&&Date.now()-t0<900&&tgt){if(ev.cancelable)ev.preventDefault();tgt.click()}};
const ca=()=>{done();say('touchcancel | moves '+mv+' | '+(Date.now()-t0)+'ms | node still in page:'+(b.isConnected?1:0)+' | renders:'+((window.__rc||0)-rc0))};
T.addEventListener('touchmove',mm,{passive:true});T.addEventListener('touchend',en,{passive:false});T.addEventListener('touchcancel',ca,{passive:true});say('touchstart on '+key(b))},{capture:true,passive:true});
const show=m=>{try{const n=document.getElementById('scan');if(n&&typeof view!=='undefined'&&view.name==='edit')n.textContent='Something failed on that tap ('+String(m).slice(0,120)+'). Nothing was changed. Please tell me this message.'}catch{}};
addEventListener('error',e=>show(e.message));addEventListener('unhandledrejection',e=>show(e.reason&&e.reason.message||e.reason));
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest(SEL);if(b)say('click reached '+key(b))},true)})();</script>
