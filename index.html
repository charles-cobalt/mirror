<script>
// ---------- storage (IndexedDB, on this device) ----------
const DB='tradejournal',ST='kv';let db;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvget=k=>new Promise(r=>{const q=db.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)});
const kvset=(k,v)=>new Promise(r=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).put(v,k);t.oncomplete=r});

// Field layout copied from the sheet screenshot. Labels and options are editable in Settings.
const YN=['Yes','No'];
const DEFAULT_CFG={v:3,groups:[
 {id:'sleep',label:'Sleep State',q:'Did you get more than 5 hours of sleep?',opts:YN,multi:false},
 {id:'psych',label:'Psychological State',q:'Are there any psychological disturbances in your life today?',opts:YN,multi:false},
 {id:'balance',label:'Balance State',q:'Did you meditate today?',opts:YN,multi:false},
 {id:'focus',label:'Focus State',q:'Were you on any social media today?',opts:YN,multi:false},
 {id:'dev',label:'Plan Deviation State',q:'Did you deviate from your initial trade plan?',opts:YN,multi:false},
 {id:'dd',label:'Drawdown State',q:'Drawdown State',opts:['Green','Yellow','Orange','Red'],multi:false,colored:true},
 {id:'catalyst',label:'Catalyst State',q:'Was there any news or catalyst within 30 minutes before or after the trade you took?',opts:YN,multi:false},
 {id:'pad',label:'Price Action Delivery State',q:'Which is driving the price action today: liquidity, catalyst news, or the market?',opts:['Liquidity','Catalyst news','Market'],multi:true}],
 extra:[{id:'amd',label:'AMD PO3',opts:['A','M','D'],multi:false}],
 notes:[['initial','Initial notes'],['plan','Setup plan'],['post','Post notes'],['deviation','Setup deviation'],['mistakes','Mistakes'],['lessons','Lessons']]};
let trades=[],cfg=DEFAULT_CFG,view={name:'list'},nid=1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=async()=>{await kvset('trades',trades);await kvset('cfg',cfg);window.JSYNC&&JSYNC.changed()};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function etTime(t){if(!t.ttime||!t.date)return '';const z=t.ttz||'America/New_York',m=/^(\d{1,2}):(\d\d)/.exec(t.ttime),d=/^(\d{4})-(\d\d)-(\d\d)/.exec(t.date);if(!m||!d)return '';
 const off=(zz,ms)=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:zz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000};
 const loc=Date.UTC(+d[1],+d[2]-1,+d[3],+m[1],+m[2]);let g=loc-off(z,loc);g=loc-off(z,g);
 return new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(g))}
function etWd(t){if(!t.ttime||!t.date)return null;const z=t.ttz||'America/New_York',m=/^(\d{1,2}):(\d\d)/.exec(t.ttime),d=/^(\d{4})-(\d\d)-(\d\d)/.exec(t.date);if(!m||!d)return null;
 const off=(zz,ms)=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:zz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000};
 const loc=Date.UTC(+d[1],+d[2]-1,+d[3],+m[1],+m[2]);let g=loc-off(z,loc);g=loc-off(z,g);
 const w=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short'}).format(new Date(g));return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(w)}
function blank(){return{id:Date.now().toString(36),date:today(),result:'',acc:'',num:'',grade:'',target:'',actual:'',pick:{},img:'',sym:'',pnl:'',qty:'',ctime:'',cx:'',ttime:'',ttz:'America/New_York',sess:'',dir:'',entry:'',stop:'',tp:'',exits:[{p:'',s:''}],fees:'',ppp:'',auto:{},notes:{}}}

// ---------- image: downscale before saving so storage stays small ----------
function shrink(file,max=1400){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};i.src=URL.createObjectURL(file)})}


// ---------- R:R math ----------
// Planned R:R = |target - entry| / |entry - initial stop|.
// Actual R (gross) = sum(size_i * (exit_i - entry) * dir) / (total size * |entry - initial stop|), initial stop even if you moved it later.
// Net R subtracts fees: (gross dollars - fees) / (total size * risk points * $ per point).
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:NaN};
function calcRR(t){const r={msgs:[]};const d=t.dir==='Long'?1:t.dir==='Short'?-1:0,e=num(t.entry),st=num(t.stop),tp=num(t.tp);
 if(!d||isNaN(e)||isNaN(st)){r.msgs.push('Enter direction, entry and initial stop to calculate.');return r}
 if((st-e)*d>=0){r.msgs.push('Stop should be below entry for a long, above entry for a short.');return r}
 const risk=Math.abs(e-st);r.risk=risk;
 if(!isNaN(tp)){if((tp-e)*d<=0)r.msgs.push('Target is on the wrong side of entry.');else r.planned=Math.abs(tp-e)/risk}
 const ex=(t.exits||[]).filter(x=>!isNaN(num(x.p)));
 if(ex.length){const multi=ex.length>1;const sizes=ex.map(x=>isNaN(num(x.s))?(multi?NaN:1):num(x.s));
  if(sizes.some(isNaN)||sizes.some(z=>z<=0)){r.msgs.push('Enter contracts for each exit so partials can be weighted.')}
  else{const tot=sizes.reduce((a,b)=>a+b,0);const pts=ex.reduce((a,x,i)=>a+sizes[i]*(num(x.p)-e)*d,0);r.gross=pts/(tot*risk);r.tot=tot;r.points=pts;
   const f=num(t.fees),pp=num(t.ppp);if(!isNaN(pp)&&pp>0){const gd=pts*pp;r.dollars=gd;if(!isNaN(f)){const net=gd-f;r.net=net/(tot*risk*pp);r.netd=net}}
   else if(!isNaN(f)&&f>0)r.msgs.push('Add $ per point to include fees.');if(!isNaN(pp)&&pp>0&&isNaN(f))r.msgs.push('Fees are blank, so this R is before fees (not assumed $0).')}}
 else r.msgs.push('Add an exit price to get the Actual R:R.');
 return r}
const netOf=t=>{if(String(t.fees==null?'':t.fees).trim()==='')return null;const r=calcRR(t);return r.net==null?null:r.net};
const fr=(x,p=2)=>(x>0?'+':'')+x.toFixed(p);
function rrHTML(t){const r=calcRR(t);let h='';
 if(r.planned!=null)h+=`<div>Planned R:R <b>1 : ${r.planned.toFixed(2)}</b></div>`;
 if(r.gross!=null){h+=`<div>Actual R:R <b>${fr(r.gross)}R</b> <span class="mu">(initial stop, before fees)</span></div>`;if(r.net!=null)h+=`<div>Actual R:R after fees <b>${fr(r.net)}R</b> <span class="mu">(${r.netd>=0?'+':'-'}$${Math.abs(r.netd).toFixed(2)})</span></div>`;
  h+=`<div class="mu">${r.gross>0?'This looks like a win by the numbers, but you still choose the Result above.':r.gross<0?'This looks like a loss by the numbers, but you still choose the Result above.':'This is break even by the numbers.'}</div>`}
 h+=r.msgs.map(m=>`<div class="mu" style="color:var(--y)">${esc(m)}</div>`).join('');return h||'<div class="mu">Fill in the inputs to calculate.</div>'}
function syncRR(){const t=view.t;readForm();const b=document.getElementById('rrbox');if(b)b.innerHTML=rrHTML(t);const r=calcRR(t);
 const tg=document.getElementById('target'),ac=document.getElementById('actual');
 if(r.planned!=null){t.target='1:'+r.planned.toFixed(2);if(tg)tg.value=t.target}
 if(r.gross!=null){t.actual=fr(r.net!=null?r.net:r.gross)+'R';if(ac)ac.value=t.actual}}

// ---------- views ----------
const icons={list:'<path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',stats:'<path d="M5 20V10M12 20V4M19 20v-7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>',set:'<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>'};
function nav(){const n=[['list','Trades'],['stats','Stats'],['set','Settings']];document.getElementById('nav').innerHTML=n.map(([k,l])=>`<button class="${view.name===k?'on':''}" data-go="${k}"><svg viewBox="0 0 24 24">${icons[k]}</svg>${l}</button>`).join('');

function pdf(mdl){const PW=612,PH=792,M=40,FS=7.5,LH=10,CH=FS*0.6,MAXC=Math.floor((PW-2*M)/CH);const pages=[[]];let y=PH-M;
 const lat=s=>String(s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2013\u2014]/g,'-').replace(/\u2022/g,'\x95').replace(/[^\x20-\x7E\x95\xA9]/g,'?');const esc=s=>lat(s).replace(/[\\()]/g,'\\$&');
 const cur=()=>pages[pages.length-1];const nl=h=>{if(y<M+h){pages.push([]);y=PH-M}};
 const put=(t,f,sz)=>{nl(sz+4);cur().push(`BT /${f} ${sz} Tf ${M} ${y} Td (${esc(t)}) Tj ET`);y-=sz+4};
 const wrap=(s,n)=>{const out=[];let l='';for(const w of lat(s).split(' ')){if((l+' '+w).trim().length>n){if(l)out.push(l);l=w;while(l.length>n){out.push(l.slice(0,n));l=l.slice(n)}}else l=(l+' '+w).trim()}out.push(l);return out};
 put(mdl.title,'F2',16);put('R basis: '+mdl.basis+'. Exported '+today()+'.','F1',9);y-=4;
 mdl.sections.forEach(s=>{y-=6;nl(80);put(s.name,'F2',11);
  if(s.name==='Notes'){s.rows.forEach(r=>wrap(r[0],95).forEach(l=>put(l,'F1',8)));return}
  if(!s.rows.length){put('No data.','F1',8);return}
  if(s.name==='Equity curve'&&s.curve){const pts=s.curve,h=110,w=PW-2*M;nl(h+14);const mn=Math.min(...pts),mx=Math.max(...pts),sp=(mx-mn)||1,Xf=i=>M+i*w/(pts.length-1),Yf=v=>y-h+(v-mn)/sp*h;
   let st=`0.6 G ${M} ${Yf(0).toFixed(1)} m ${PW-M} ${Yf(0).toFixed(1)} l S 0 G 1.2 w `+pts.map((v,i)=>`${Xf(i).toFixed(1)} ${Yf(v).toFixed(1)} ${i?'l':'m'}`).join(' ')+' S 0.5 w';cur().push(st);y-=h+16;put('Cumulative R '+pts[pts.length-1].toFixed(2)+'R, peak '+mx.toFixed(2)+'R, low '+mn.toFixed(2)+'R','F1',8)}
  const all=[s.head,...s.rows.map(r=>r.map(v=>v==null?'':String(v)))],n=s.head.length;
  const wid=Array.from({length:n},(_,i)=>Math.min(34,Math.max(...all.map(r=>(r[i]||'').length))));
  // wrap header to fit width: if total exceeds MAXC, use stacked key:value rows instead
  const tot=wid.reduce((a,b)=>a+b,0)+3*(n-1);
  if(tot<=MAXC){all.forEach((r,ri)=>{put(r.map((v,i)=>lat(v).slice(0,wid[i]).padEnd(wid[i])).join(' | '),ri?'F3':'F4',FS)})}
  else{s.rows.forEach(r=>{put(lat(r[0]==null?'':r[0]),'F2',8);r.slice(1).forEach((v,i)=>{if(v===''||v==null)return;wrap(s.head[i+1]+': '+v,MAXC).forEach(l=>put('   '+l,'F1',FS))})})}
 });
 const objs=[];const add=x=>{objs.push(x);return objs.length};add('<< /Type /Catalog /Pages 2 0 R >>');add('x');
 ['Helvetica','Helvetica-Bold','Courier','Courier-Bold'].forEach(f=>add(`<< /Type /Font /Subtype /Type1 /BaseFont /${f} /Encoding /WinAnsiEncoding >>`));
 const kids=[];pages.forEach(pg=>{const st=pg.concat([FOOTPDF(PW,22)]).join('\n');const c=add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`);kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R /F4 6 0 R >> >> /Contents ${c} 0 R >>`)+' 0 R')});
 objs[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;let out='%PDF-1.4\n';const offs=[];objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});const xr=out.length;
 out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;
 const b=new Uint8Array(out.length);for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i)&255;return new Blob([b],{type:'application/pdf'})}

document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-sexp],[data-iexp]');if(!b)return;const iso=b.dataset.iexp!=null,k=b.dataset.sexp||b.dataset.iexp,note=document.getElementById('expnote');
