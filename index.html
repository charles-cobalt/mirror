<script>
// ---------- storage (IndexedDB, on this device) ----------
const DB='tradejournal',ST='kv';let db;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kvget=k=>new Promise(r=>{const q=db.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)});
const kvset=(k,v)=>new Promise(r=>{const t=db.transaction(ST,'readwrite');t.objectStore(ST).put(v,k);t.oncomplete=r});

// Field layout copied from the sheet screenshot. Labels and options are editable in Settings.
const YN=['Yes','No'];
const DEFAULT_CFG={v:3,groups:[
 {id:'sleep',label:'Sleep state',q:'Did you get more than 5 hours of sleep?',opts:YN,multi:false},
 {id:'psych',label:'Psychological state',q:'Are there any psychological disturbances in your life today?',opts:YN,multi:false},
 {id:'balance',label:'Balance state',q:'Did you meditate today?',opts:YN,multi:false},
 {id:'focus',label:'Focus state',q:'Were you on any social media today?',opts:YN,multi:false},
 {id:'dev',label:'Plan Deviation State',q:'Did you deviate from your initial trade plan?',opts:YN,multi:false},
 {id:'dd',label:'Drawdown state',q:'Drawdown state',opts:['Green','Yellow','Orange','Red'],multi:false,colored:true},
 {id:'catalyst',label:'Catalyst state',q:'Was there any news or catalyst within 30 minutes before or after the trade you took?',opts:YN,multi:false},
 {id:'pad',label:'Price action delivery factor',q:'Which is driving the price action today: liquidity, catalyst news, or the market?',opts:['Liquidity','Catalyst news','Market'],multi:true}],
 extra:[{id:'amd',label:'AMD PO3',opts:['A','M','D'],multi:false}],
 notes:[['initial','Initial notes'],['plan','Setup plan'],['post','Post notes'],['deviation','Setup deviation'],['mistakes','Mistakes'],['lessons','Lessons']]};
let trades=[],cfg=DEFAULT_CFG,view={name:'list'},nid=1;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=async()=>{await kvset('trades',trades);await kvset('cfg',cfg)};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function etTime(t){if(!t.ttime||!t.date)return '';const z=t.ttz||'America/New_York',m=/^(\d{1,2}):(\d\d)/.exec(t.ttime),d=/^(\d{4})-(\d\d)-(\d\d)/.exec(t.date);if(!m||!d)return '';
 const off=(zz,ms)=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:zz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000};
 const loc=Date.UTC(+d[1],+d[2]-1,+d[3],+m[1],+m[2]);let g=loc-off(z,loc);g=loc-off(z,g);
 return new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(new Date(g))}
function etWd(t){if(!t.ttime||!t.date)return null;const z=t.ttz||'America/New_York',m=/^(\d{1,2}):(\d\d)/.exec(t.ttime),d=/^(\d{4})-(\d\d)-(\d\d)/.exec(t.date);if(!m||!d)return null;
 const off=(zz,ms)=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:zz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}).formatToParts(new Date(ms)).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000};
 const loc=Date.UTC(+d[1],+d[2]-1,+d[3],+m[1],+m[2]);let g=loc-off(z,loc);g=loc-off(z,g);
 const w=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short'}).format(new Date(g));return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(w)}
function blank(){return{id:Date.now().toString(36),date:today(),result:'',acc:'',num:'',grade:'',target:'',actual:'',pick:{},img:'',sym:'',pnl:'',qty:'',ctime:'',cx:'',ttime:'',ttz:'America/New_York',sess:'',dir:'',entry:'',stop:'',tp:'',exits:[{p:'',s:''}],fees:'',ppp:'',auto:{},notes:{}}}

// ---------- image: downscale before saving so storage stays small ----------
function shrink(file,max=1400){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};i.src=URL.createObjectURL(file)})}


// ---------- R:R math ----------
// Planned R:R = |target - entry| / |entry - initial stop|.
// Actual R (gross) = sum(size_i * (exit_i - entry) * dir) / (total size * |entry - initial stop|), initial stop even if you moved it later.
// Net R subtracts fees: (gross dollars - fees) / (total size * risk points * $ per point).
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:NaN};
function calcRR(t){const r={msgs:[]};const d=t.dir==='Long'?1:t.dir==='Short'?-1:0,e=num(t.entry),st=num(t.stop),tp=num(t.tp);
 if(!d||isNaN(e)||isNaN(st)){r.msgs.push('Enter direction, entry and initial stop to calculate.');return r}
 if((st-e)*d>=0){r.msgs.push('Stop should be below entry for a long, above entry for a short.');return r}
 const risk=Math.abs(e-st);r.risk=risk;
 if(!isNaN(tp)){if((tp-e)*d<=0)r.msgs.push('Target is on the wrong side of entry.');else r.planned=Math.abs(tp-e)/risk}
 const ex=(t.exits||[]).filter(x=>!isNaN(num(x.p)));
 if(ex.length){const multi=ex.length>1;const sizes=ex.map(x=>isNaN(num(x.s))?(multi?NaN:1):num(x.s));
  if(sizes.some(isNaN)||sizes.some(z=>z<=0)){r.msgs.push('Enter contracts for each exit so partials can be weighted.')}
  else{const tot=sizes.reduce((a,b)=>a+b,0);const pts=ex.reduce((a,x,i)=>a+sizes[i]*(num(x.p)-e)*d,0);r.gross=pts/(tot*risk);r.tot=tot;r.points=pts;
   const f=num(t.fees),pp=num(t.ppp);if(!isNaN(pp)&&pp>0){const gd=pts*pp;r.dollars=gd;const net=gd-(isNaN(f)?0:f);r.net=net/(tot*risk*pp);r.netd=net}
   else if(!isNaN(f)&&f>0)r.msgs.push('Add $ per point to include fees.')}}
 else r.msgs.push('Add an exit price to get the Actual R:R.');
 return r}
const netOf=t=>{if(String(t.fees==null?'':t.fees).trim()==='')return null;const r=calcRR(t);return r.net==null?null:r.net};
const fr=(x,p=2)=>(x>0?'+':'')+x.toFixed(p);
function rrHTML(t){const r=calcRR(t);let h='';
 if(r.planned!=null)h+=`<div>Planned R:R <b>1 : ${r.planned.toFixed(2)}</b></div>`;
 if(r.gross!=null){h+=`<div>Actual R:R <b>${fr(r.gross)}R</b> <span class="mu">(initial stop, before fees)</span></div>`;if(r.net!=null)h+=`<div>Actual R:R after fees <b>${fr(r.net)}R</b> <span class="mu">(${r.netd>=0?'+':'-'}$${Math.abs(r.netd).toFixed(2)})</span></div>`;
  h+=`<div class="mu">${r.gross>0?'This looks like a win by the numbers, but you still choose the Result above.':r.gross<0?'This looks like a loss by the numbers, but you still choose the Result above.':'This is break even by the numbers.'}</div>`}
 h+=r.msgs.map(m=>`<div class="mu" style="color:var(--y)">${esc(m)}</div>`).join('');return h||'<div class="mu">Fill in the inputs to calculate.</div>'}
function syncRR(){const t=view.t;readForm();const b=document.getElementById('rrbox');if(b)b.innerHTML=rrHTML(t);const r=calcRR(t);
 const tg=document.getElementById('target'),ac=document.getElementById('actual');
 if(r.planned!=null){t.target='1:'+r.planned.toFixed(2);if(tg)tg.value=t.target}
 if(r.gross!=null){t.actual=fr(r.net!=null?r.net:r.gross)+'R';if(ac)ac.value=t.actual}}

// ---------- views ----------
const icons={list:'<path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>',stats:'<path d="M5 20V10M12 20V4M19 20v-7" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/>',set:'<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>'};
function nav(){const n=[['list','Trades'],['stats','Stats'],['set','Settings']];document.getElementById('nav').innerHTML=n.map(([k,l])=>`<button class="${view.name===k?'on':''}" data-go="${k}"><svg viewBox="0 0 24 24">${icons[k]}</svg>${l}</button>`).join('');
 document.getElementById('nav').style.display=['edit','detail'].includes(view.name)?'none':'';document.getElementById('fab').style.display=['edit','detail','stats','set'].includes(view.name)?'none':''}
const pill=r=>r==='profit'?'<span class="pill p-profit">PROFIT</span>':r==='loss'?'<span class="pill p-loss">LOSS</span>':r==='be'?'<span class="pill p-none">BREAKEVEN</span>':'<span class="pill p-none">OPEN</span>';
function render(){const a=document.getElementById('app');nav();({list:rList,stats:rStats,set:rSet,edit:rEdit,detail:rDetail})[view.name](a);if(view.name==='detail')drawSheet(document.getElementById('sheet'),view.t);window.scrollTo(0,0)}
function rList(a){const s=[...trades].sort((x,y)=>y.date.localeCompare(x.date)||y.id.localeCompare(x.id));
 a.innerHTML='<h1>Trades</h1>'+(s.length?s.map(t=>`<div class="card trade" data-open="${t.id}">${t.img?`<img src="${t.img}">`:'<img alt="">'}<div class="m"><div class="t">${t.num?'#'+esc(t.num)+' · ':''}${esc(t.date)}${etTime(t)?' · '+esc(etTime(t)):''}</div><div class="s">${esc([t.sym,t.grade?'Grade '+t.grade:''].filter(Boolean).join(' · '))}${t.target?' · Target '+esc(t.target):''}${t.actual?' · Actual R:R '+esc(t.actual):''}</div></div>${pill(t.result)}</div>`).join(''):'<div class="empty">No trades yet.<br>Tap + to log your first one.</div>')}
// ---------- Stats: metrics, equity curve, calendar, sessions ----------
const SESS_DEFAULT=[{n:'Asia',s:'18:00',e:'02:00'},{n:'London',s:'02:00',e:'09:30'},{n:'NY',s:'09:30',e:'17:00'}];
const OLD_SESS='Asia20:00-02:00|London02:00-05:00|NY07:00-12:00';

// Composed entry: chart on top, your answers and notes below (same layout idea as your sheet)
function wrap(g,text,x,y,mw,lh){const words=String(text||'').split(/\s+/);let line='',n=0;for(const w of words){const t=line?line+' '+w:w;if(g.measureText(t).width>mw&&line){g.fillText(line,x,y+n*lh);line=w;n++}else line=t}g.fillText(line,x,y+n*lh);return n+1}
function lines(g,text,mw){const out=[];for(const para of String(text||'').split('\n')){let line='';for(const w of para.split(/\s+/)){const t=line?line+' '+w:w;if(g.measureText(t).width>mw&&line){out.push(line);line=w}else line=t}out.push(line)}return out}
// Composed entry: chart on top; left pane = compact metadata, right pane = journal entry (same arrangement as your sheet). Drawn at 2400px wide so text stays sharp when exported.
function drawSheet(c,t,done){const W=2400,Lw=Math.round(W*0.315),RH=50,F=26,pad=14;const pick=id=>t.pick[id]||[];
 const yn=(id,label)=>({label,opts:['YES','NO'],on:pick(id).map(x=>x.toUpperCase())});
 const rows=[];const r0=calcRR(t);
 rows.push({cells:[{opts:['PROFIT'],on:t.result==='profit'?['PROFIT']:[]},{opts:['LOSS'],on:t.result==='loss'?['LOSS']:[]},{opts:['BREAKEVEN'],on:t.result==='be'?['BREAKEVEN']:[]},{text:'ACC #  '+(t.acc||'')}]});
 rows.push({cells:[{text:'GRADE: '+(t.grade||'')},{text:'TARGET R:R: '+(t.target||'')},{text:'ACTUAL R:R: '+(t.actual||'')}]});
 rows.push({label:'AMD PO3:',opts:['A','M','D'],on:pick('amd')});
 for(const g of cfg.groups){const short={sleep:'SLEEP >5 HRS',psych:'PSYCH DISTURBANCE',balance:'MEDITATED',focus:'SOCIAL MEDIA',dd:'DD STATE:',catalyst:'NEWS +-30 MIN',pad:'PA D. FACTOR:',dev:'PLAN DEVIATION'}[g.id]||g.label.toUpperCase();
  rows.push({label:short,opts:g.opts.map(o=>o.toUpperCase()),on:pick(g.id).map(x=>x.toUpperCase())})}
 if(t.dir||t.entry||t.stop)rows.push({text:[t.dir&&t.dir.toUpperCase(),t.entry&&'ENTRY '+t.entry,t.stop&&'STOP '+t.stop].filter(Boolean).join('   ')});
 if(etTime(t)||t.cx||t.ctime)rows.push({text:[etTime(t)&&'TIME OF TRADE '+etTime(t),t.cx&&'CHART '+t.cx,t.ctime&&'CLOCK '+t.ctime].filter(Boolean).join('   ')});
 const g0=document.createElement('canvas').getContext('2d');g0.font=F+'px sans-serif';
 const Rw=W-Lw,tw=Rw-2*pad,notes=cfg.notes.filter(([k])=>t.notes[k]);
 let rh=RH+pad;for(const [k,l] of notes){rh+=F+8+lines(g0,t.notes[k],tw).length*(F+6)+pad}
 const lh=rows.length*RH,bodyH=Math.max(lh,rh,RH*9);
 const draw=img=>{const ih=img?Math.round(W*img.naturalHeight/img.naturalWidth):0;c.width=W;c.height=ih+bodyH;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,c.height);if(img)g.drawImage(img,0,0,W,ih);
  g.strokeStyle='#000';g.fillStyle='#000';g.lineWidth=3;g.textBaseline='middle';
  const box=(x,y,on)=>{const z=F-6;g.strokeRect(x,y-z/2,z,z);if(on){g.beginPath();g.moveTo(x+4,y-z/2+4);g.lineTo(x+z-4,y+z/2-4);g.moveTo(x+z-4,y-z/2+4);g.lineTo(x+4,y+z/2-4);g.stroke()}return z};
  g.strokeRect(1.5,ih+1.5,Lw,bodyH-3);g.strokeRect(Lw+1.5,ih+1.5,Rw-3,bodyH-3);
  // right pane header
  g.font='bold '+(F-4)+'px sans-serif';g.textAlign='center';g.fillText('INITIAL NOTES | SETUP PLAN | POST NOTES | SETUP DEVIATION | MISTAKES | LESSONS',Lw+(Rw-RH*3)/2,ih+RH/2);
  g.beginPath();g.moveTo(Lw,ih+RH);g.lineTo(W,ih+RH);g.moveTo(W-RH*3,ih);g.lineTo(W-RH*3,ih+RH);g.stroke();g.fillText('TRADE # '+(t.num||''),W-RH*1.5,ih+RH/2);
  g.textAlign='left';let y=ih+RH+pad;
  for(const [k,l] of notes){g.font='bold '+F+'px sans-serif';g.fillText(l.toUpperCase(),Lw+pad,y+F/2);y+=F+8;g.font=F+'px sans-serif';for(const ln of lines(g,t.notes[k],tw)){g.fillText(ln,Lw+pad,y+F/2);y+=F+6}y+=pad}
  // left pane rows
  let ry=ih;for(const r of rows){g.beginPath();g.moveTo(0,ry+RH);g.lineTo(Lw,ry+RH);g.stroke();const cy=ry+RH/2;g.font='bold '+F+'px sans-serif';g.textAlign='left';
   if(r.cells){const cw=Lw/r.cells.length;r.cells.forEach((cell,i)=>{if(i){g.beginPath();g.moveTo(cw*i,ry);g.lineTo(cw*i,ry+RH);g.stroke()}let x=cw*i+pad;if(cell.opts){const z=box(x,cy,cell.on.length>0);g.fillText(cell.opts[0],x+z+10,cy)}else{let fs=F;g.font='bold '+fs+'px sans-serif';while(g.measureText(cell.text).width>cw-2*pad&&fs>14){fs--;g.font='bold '+fs+'px sans-serif'}g.fillText(cell.text,x,cy)}})}
   else if(r.opts){let x=pad;let fs=F;const need=()=>(r.label?g.measureText(r.label).width+pad:0)+r.opts.reduce((a,o)=>a+g.measureText(o).width+(F-6)+36,0);g.font='bold '+fs+'px sans-serif';while(need()>Lw-2*pad&&fs>13){fs--;g.font='bold '+fs+'px sans-serif'}
    if(r.label){g.fillText(r.label,x,cy);x+=g.measureText(r.label).width+pad;g.beginPath();g.moveTo(x-pad/2,ry);g.lineTo(x-pad/2,ry+RH);g.stroke()}
    for(const o of r.opts){const z=box(x,cy,r.on.includes(o)||r.on.includes(o.toLowerCase()));g.fillText(o,x+z+8,cy);x+=z+8+g.measureText(o).width+28}}
   else if(r.text){let fs=F;g.font='bold '+fs+'px sans-serif';while(g.measureText(r.text).width>Lw-2*pad&&fs>14){fs--;g.font='bold '+fs+'px sans-serif'}g.fillText(r.text,pad,cy)}
   ry+=RH}
  done&&done(c)};
 if(t.img){const i=new Image();i.onload=()=>draw(i);i.src=t.img}else draw(null)}
async function shareSheet(t){const c=document.createElement('canvas');drawSheet(c,t,async cv=>{cv.toBlob(async b=>{const f=new File([b],'journal-'+(t.num||t.date)+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch{}}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()}})})}

// ---------- events ----------
function readForm(){const t=view.t;for(const k of['date','num','acc','grade','target','actual','sym','ttime','ttz','sess','ctime','cx','entry','stop','tp','fees','ppp']){const e=document.getElementById(k);if(e)t[k]=e.value}document.querySelectorAll('[data-n]').forEach(e=>t.notes[e.dataset.n]=e.value);if(document.querySelector('[data-exp]')){t.exits=[...document.querySelectorAll('[data-exp]')].map((e,i)=>({p:e.value,s:(document.querySelector('[data-exs="'+i+'"]')||{}).value||''}))}}
document.addEventListener('click',async e=>{const b=e.target.closest('button,[data-open]');if(!b)return;const d=b.dataset;
 if(d.go){view={name:d.go};render()}
 else if(b.id==='fab'){view={name:'edit',t:blank(),isNew:true};render()}
 else if(d.open){view={name:'detail',t:trades.find(x=>x.id===d.open)};render()}
 else if(d.dir){readForm();view.t.dir=view.t.dir===d.dir?'':d.dir;render();syncRR()}
 else if(b.id==='addexit'){readForm();view.t.exits.push({p:'',s:''});render()}
 else if(b.id==='shareimg'){shareSheet(view.t)}
 else if(b.id==='back'){view={name:'list'};render()}
 else if(b.id==='edit'){view={name:'edit',t:structuredClone(view.t)};render()}
 else if(b.id==='cancel'){view={name:'list'};render()}
 else if(b.id==='save'){readForm();const i=trades.findIndex(x=>x.id===view.t.id);i<0?trades.push(view.t):trades[i]=view.t;await save();view={name:'list'};render()}
 else if(b.id==='del'){if(confirm('Delete this trade?')){trades=trades.filter(x=>x.id!==view.t.id);await save();view={name:'list'};render()}}
 else if(b.id==='pick'){readForm();document.getElementById('file').click()}
 else if(d.res){readForm();view.t.result=view.t.result===d.res?'':d.res;render()}
 else if(d.g){readForm();const t=view.t,g=[...cfg.groups,...cfg.extra].find(x=>x.id===d.g),cur=t.pick[d.g]||[];t.pick[d.g]=cur.includes(d.o)?cur.filter(x=>x!==d.o):(g.multi?[...cur,d.o]:[d.o]);const y=scrollY;render();scrollTo(0,y)}
 else if(b.id==='exp'){const blob=new Blob([JSON.stringify({trades,cfg},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trade-journal-'+today()+'.json';a.click()}
 else if(b.id==='impb'){document.getElementById('imp').click()}
 else if(b.id==='svset'){document.querySelectorAll('[data-gl]').forEach(i=>cfg.groups.find(g=>g.id===i.dataset.gl).label=i.value.trim()||'Untitled');document.querySelectorAll('[data-go2]').forEach(i=>cfg.groups.find(g=>g.id===i.dataset.go2).opts=i.value.split(',').map(s=>s.trim()).filter(Boolean));await save();alert('Saved')}
});
document.addEventListener('input',e=>{if(view.name==='edit'&&e.target.closest('#app')&&e.target.matches('#entry,#stop,#tp,#fees,#ppp,[data-exp],[data-exs]'))syncRR()});
document.getElementById('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const big=URL.createObjectURL(f);view.t.img=await shrink(f,1400);view.scan='Reading screenshot...';render();const set=m=>{view.scan=m;const s=document.getElementById('scan');if(s)s.textContent=m};
 try{const r=await readShot(big,set),t=view.t,fd=r.found;readForm();t.auto={};
  if(fd.symbol){t.sym=fd.symbol;t.auto.sym=1}if(fd.cx){t.cx=fd.cx;t.auto.cx=1}if(fd.clock){t.ctime=fd.clock;t.auto.ctime=1}
  const n=Object.keys(fd).length;view.scan=n?'Filled what could be read. Yellow fields came from the screenshot. Please confirm them. Anything not readable, such as time of trade, entry or exit, is left blank for you to enter. Everything else (date, grade, states, notes) is yours to enter.':'Could not read trade details from this screenshot. Fill in the fields manually.'}
 catch(err){view.scan='Could not run the screenshot reader (needs internet the first time). Fill in the fields manually.'}render()};
document.getElementById('imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.trades))throw 0;if(!confirm('Import '+j.trades.length+' trades? Matching trades are overwritten and the others are kept.'))return;const m=new Map(trades.map(t=>[t.id,t]));j.trades.forEach(t=>m.set(t.id,t));trades=[...m.values()];await save();view={name:'list'};render()}catch{alert('That file is not a journal backup.')}e.target.value=''};

(async()=>{db=await open();trades=(await kvget('trades'))||[];cfg=(await kvget('cfg'));if(!cfg||cfg.v!==3)cfg=DEFAULT_CFG;else{const q={catalyst:[DEFAULT_CFG.groups.find(g=>g.id==='catalyst').q,'Is there any news or catalyst within 30 minutes before or after the taken trade?'],pad:[DEFAULT_CFG.groups.find(g=>g.id==='pad').q,'Is it liquidity, catalyst news, or market that is driving the price action today?']};cfg.groups.forEach(g=>{if(q[g.id]&&g.q===q[g.id][1])g.q=q[g.id][0]});cfg.groups.forEach(g=>{if(g.id==='pad'){g.opts=g.opts.filter(o=>o!=='Random');if(/random/i.test(g.q))g.q=DEFAULT_CFG.groups.find(x=>x.id==='pad').q}});if(!cfg.groups.some(g=>g.id==='dev')){const fi=cfg.groups.findIndex(g=>g.id==='focus');cfg.groups.splice(fi>=0?fi+1:cfg.groups.length,0,JSON.parse(JSON.stringify(DEFAULT_CFG.groups.find(g=>g.id==='dev'))))}}
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if(location.hash==='#new'){view={name:'edit',t:blank(),isNew:true}}
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render()})();
</script><script>if(!matchMedia('(prefers-reduced-motion:reduce)').matches){let q=0;addEventListener('scroll',()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;document.documentElement.style.setProperty('--py',Math.min(scrollY*.25,300))})},{passive:true})}</script>
<script>if(!matchMedia('(prefers-reduced-motion:reduce)').matches){const app=document.getElementById('app');let q=0;const cl=x=>Math.max(0,Math.min(1,x));
const upd=()=>{q=0;const H=innerHeight,ae=document.activeElement;app.querySelectorAll('.card,h1,h2,.top+*,img.shot').forEach(e=>{if(e.contains(ae)){e.style.opacity=1;return}const r=e.getBoundingClientRect();const o=.3+.7*Math.min(cl((H-r.top)/140),cl(r.bottom/100));e.style.opacity=o.toFixed(2)})};
const go=()=>{if(!q)q=requestAnimationFrame(upd)};addEventListener('scroll',go,{passive:true});addEventListener('resize',go);new MutationObserver(go).observe(app,{childList:true,subtree:true});go()}</script>
