name: add-icons
on:
  push:
    paths:
      - '.github/workflows/icon.yml'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write icons
        run: |
          echo '' | base64 -d > apple-touch-icon.png
          echo '' | base64 -d > icon-512.png
          file apple-touch-icon.png icon-512.png
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apple-touch-icon.png icon-512.png
          git commit -m "Add Home Screen icon PNGs"
          git push
